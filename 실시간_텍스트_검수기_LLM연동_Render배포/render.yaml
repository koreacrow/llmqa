services:
  - type: web
    name: game-ai-workbench
    runtime: python
    buildCommand: npm ci && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DB_PATH
        value: /var/data/app.db
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: app-data
      mountPath: /var/data
      sizeGB: 1
